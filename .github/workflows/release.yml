name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish Linux host agent
        run: >-
          dotnet publish control/src/LumenGame.Agent/LumenGame.Agent.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false
          -o artifacts/publish/linux-agent
      - name: Publish Windows dashboard
        run: >-
          dotnet publish control/src/LumenGame.Windows/LumenGame.Windows.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false
          -o artifacts/publish/windows
      - name: Assemble release archives
        run: |
          mkdir -p artifacts/linux-package/bin artifacts/linux-package/control artifacts/windows-package
          cp artifacts/publish/linux-agent/ValheimWorldControl.Agent artifacts/linux-package/bin/
          cp deploy/valheim-world-control-agent.service artifacts/linux-package/
          cp compose.yaml .env.example README.md LICENSE NOTICE artifacts/linux-package/
          rsync -a --exclude='bin/' --exclude='obj/' control/ artifacts/linux-package/control/
          cp -R runtime examples docs scripts tools artifacts/linux-package/
          cp artifacts/publish/windows/ValheimWorldControl.exe artifacts/windows-package/
          cp deploy/Install.cmd deploy/Install-ValheimWorldControl.ps1 artifacts/windows-package/
          (cd artifacts/linux-package && tar -czf ../valheim-world-control-linux-x64.tar.gz .)
          (cd artifacts/windows-package && zip -r ../valheim-world-control-windows-x64.zip .)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/valheim-world-control-linux-x64.tar.gz
          artifacts/valheim-world-control-windows-x64.zip
          --verify-tag --generate-notes
          --title "Valheim World Control $GITHUB_REF_NAME"


