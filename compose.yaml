name: valheim-world-control

services:
  valheim:
    build:
      context: ./runtime
    image: valheim-world-control/runtime:local
    container_name: ${VWC_CONTAINER_NAME:-valheim-server}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    stop_grace_period: 2m
    env_file:
      - ${VWC_SERVER_ENV_FILE:-./data/control/server.env}
    ports:
      - "${VALHEIM_PORT:-2456}:${SERVER_PORT:-2456}/udp"
      - "${VALHEIM_QUERY_PORT:-2457}:${SERVER_QUERY_PORT:-2457}/udp"
    volumes:
      - ${VWC_DATA_ROOT:-./data}/server:/opt/valheim:ro
      - ${VWC_DATA_ROOT:-./data}/runtime:/home/valheim/.config/unity3d/IronGate/Valheim
      - ${VWC_DATA_ROOT:-./data}/secrets/world-passwords:/run/world-passwords:ro
    secrets:
      - server_password
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  control-api:
    build:
      context: ./control
      dockerfile: Dockerfile.api
    image: valheim-world-control/api:local
    container_name: ${VWC_API_CONTAINER_NAME:-valheim-world-control-api}
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "${VWC_AGENT_GID:-1001}"
    read_only: true
    environment:
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: ${TLS_CERTIFICATE_FILE:-/tls/server.crt}
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: ${TLS_PRIVATE_KEY_FILE:-/tls/server.key}
      ValheimWorldControl__DataDirectory: /data
      ValheimWorldControl__CatalogFile: /control-state/catalog.json
      ValheimWorldControl__StatusFile: /control-state/server-status.json
      ValheimWorldControl__BootstrapAdminPasswordFile: /run/secrets/bootstrap_admin_password
      ValheimWorldControl__AgentSocketPath: /run/valheim-world-control/agent.sock
      ValheimWorldControl__ControlAgentEnabled: "${CONTROL_AGENT_ENABLED:-false}"
    ports:
      - "8443:8443/tcp"
    volumes:
      - ${VWC_DATA_ROOT:-./data}/control/api-data:/data
      # Mount the directory so atomic file replacements remain visible inside the container.
      - ${VWC_DATA_ROOT:-./data}/control:/control-state:ro
      - ${VWC_DATA_ROOT:-./data}/control/tls:/tls:ro
      # Mount the runtime directory so an agent restart can replace its socket safely.
      - /run/valheim-world-control:/run/valheim-world-control:ro
    secrets:
      - bootstrap_admin_password
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  server_password:
    file: ${VWC_DATA_ROOT:-./data}/secrets/server_password
  bootstrap_admin_password:
    file: ${VWC_DATA_ROOT:-./data}/secrets/bootstrap_admin_password
